<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Sistema</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .gradient-text {
      background: linear-gradient(to right, #8b5cf6, #3b82f6, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .input-field {
      transition: all 0.3s ease;
    }
    
    .input-field:focus {
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
    }
    
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.3);
      animation: float 15s infinite linear;
    }
    
    @keyframes float {
      0% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-20px); opacity: 0.8; }
      100% { transform: translateY(0); opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <div class="particles" id="particles"></div>

  <div class="glass-effect rounded-2xl shadow-2xl w-full max-w-md p-8 relative z-10">

    <!-- HEADER -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-r from-purple-600 to-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fas fa-lock text-white text-xl"></i>
      </div>
      <h1 class="text-3xl font-bold gradient-text">Easy Storage</h1>
      <p class="text-gray-400 mt-2">Entre com suas credenciais</p>
    </div>

    <!-- FORM -->
    <form id="loginForm" class="space-y-6">
      <input id="email" type="email" placeholder="Email"
        class="input-field w-full bg-gray-900 text-white border border-gray-700 rounded-lg px-4 py-3">

      <input id="senha" type="password" placeholder="Senha"
        class="input-field w-full bg-gray-900 text-white border border-gray-700 rounded-lg px-4 py-3">

      <button type="button" onclick="fazerLogin()"
        class="w-full bg-gradient-to-r from-purple-600 to-blue-500 text-white py-3 rounded-lg font-medium">
        Entrar
      </button>
    </form>

    <!-- LINKS -->
    <div class="flex justify-between mt-4 text-sm">
      <a href="cadastro.html" class="text-purple-400 hover:text-purple-300">
        Criar conta
      </a>
      <a href="#" class="text-purple-400 hover:text-purple-300">
        Esqueceu a senha?
      </a>
    </div>

    <!-- SOCIAL -->
    <div class="grid grid-cols-2 gap-3 mt-6">
      <button class="bg-gray-800 text-white py-2 rounded-lg">
        <i class="fab fa-google text-red-400 mr-2"></i> Google
      </button>
      <button class="bg-gray-800 text-white py-2 rounded-lg">
        <i class="fab fa-microsoft text-blue-400 mr-2"></i> Microsoft
      </button>
    </div>

  </div>

<script>

async function fazerLogin() {
  const email = document.getElementById('email').value;
  const senha = document.getElementById('senha').value;

  if (!email || !senha) return alert('Preencha todos os campos');

  try {
    const response = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });

    const data = await response.json();

    if (response.ok) {
      localStorage.setItem('usuario', JSON.stringify(data.usuario));
      window.location.href = 'dashboard.html';
    } else {
      alert(data.message);
    }

  } catch (err) {
    alert('Erro ao conectar com servidor');
  }
}

function criarParticulas() {
  const container = document.getElementById('particles');

  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.width = p.style.height = Math.random()*50+10+'px';
    p.style.left = Math.random()*100+'%';
    p.style.top = Math.random()*100+'%';
    container.appendChild(p);
  }
}

window.onload = criarParticulas;

</script>

</body>
</html>
